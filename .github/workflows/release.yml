name: Release

# Filename is load-bearing: the npm trusted publisher (OIDC) is registered
# against `release.yml` + the `production` environment. Renaming this file
# breaks publish auth.

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ── Publish @latest ──────────────────────────────────────────────────────
  # Runs on every push to main. Uses semantic-release to determine the version
  # from conventional commits, publish it to npm under the @latest dist-tag,
  # and create a GitHub release.
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create git tags and GitHub releases
      id-token: write   # npm provenance attestation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # semantic-release needs full history
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
